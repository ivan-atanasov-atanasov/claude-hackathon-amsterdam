openapi: 3.1.0

info:
  title: Hackathon API
  version: 0.1.0

servers:
  - url: http://localhost:8000
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # Add new endpoints below as you build features. Example:
  #
  # /users:
  #   get:
  #     summary: List all users
  #     responses:
  #       "200":
  #         description: A list of users
  #         content:
  #           application/json:
  #             schema:
  #               type: array
  #               items:
  #                 $ref: "#/components/schemas/User"
  #
  # /users/{id}:
  #   get:
  #     summary: Get a user by ID
  #     parameters:
  #       - name: id
  #         in: path
  #         required: true
  #         schema:
  #           type: string
  #     responses:
  #       "200":
  #         description: A single user
  #         content:
  #           application/json:
  #             schema:
  #               $ref: "#/components/schemas/User"
  #       "404":
  #         description: Not found

components:
  schemas:
    # Add shared schemas here. Example:
    #
    # User:
    #   type: object
    #   properties:
    #     id:
    #       type: string
    #     email:
    #       type: string
    #     created_at:
    #       type: string
    #       format: date-time

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
